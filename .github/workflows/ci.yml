name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Build
        run: moon build --target native
      - name: Collection example
        run: moon run --target native examples/collection
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Maintained Markdown contracts and links
        run: python tools/check_documentation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Offline MoonBit lab build and DOM contracts
        run: |
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          python tools/build_community_lab.py
          node tools/verify_community_lab.mjs
      - name: Independent DICOM verification
        run: |
          python -m pip install -r requirements-qa.txt -r requirements-enterprise.txt
          python tools/verify_with_pydicom.py
      - name: Independent DICOM JSON bidirectional acceptance
        run: python tools/verify_dicom_json.py --record tmp/c3-dicom-json-ci.json
      - name: Rulebook and public explanation acceptance
        run: python tools/verify_rulebook.py --index-only
      - name: Native evidence and public output regression
        if: runner.os != 'Windows'
        run: python tools/verify_rulebook.py --record tmp/w0-rulebook-ci.json
      - name: Independent fixed corpus and actual writer acceptance
        run: python tools/verify_conformance.py --record tmp/w1-conformance-ci.json
      - name: Release metadata regression
        run: python tools/verify_release_readiness.py
      - name: Independent classic CT research acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_ct_research.py --record tmp/w3-ct-research-ci.json
      - name: Offline distribution regression
        if: runner.os != 'Windows'
        run: |
          python -m pip download --only-binary=:all: --dest tmp/enterprise-wheels -r requirements-enterprise.txt
          python tools/verify_distribution.py --wheels tmp/enterprise-wheels --record tmp/offline-distribution.json
      - name: Persistent identity regression
        if: runner.os != 'Windows'
        run: |
          python tools/verify_persistent_identity.py --record tmp/p2-persistent-identity-ci.json
          python tools/verify_recovery.py
          python tools/verify_risk_gate.py
          python tools/verify_attestation.py
          python tools/verify_pilot.py --record tmp/p7-ci.json
      - name: W4 state, fault and parser fuzz acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_w4.py --record tmp/w4-state-model-ci.json
      - name: Dataset preflight acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_dataset_preflight.py --record tmp/v2-preflight-ci.json
      - name: W5 loopback workbench acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_workbench.py
      - name: W6 archive consumer acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_consumer.py tmp/w6-consumer-ci.json
      - name: W7 operator rehearsal and field-boundary acceptance
        if: runner.os != 'Windows'
        run: python tools/verify_w7_rehearsal.py --record tmp/w7-rehearsal-ci.json
      - name: W7 field evidence template contract
        run: python tools/verify_field_evidence.py --input docs/field-evidence/w7-field-evidence.template.json
      - name: Package
        run: moon package
      - name: Exact source snapshot in module package
        run: python tools/verify_platform_snapshot.py --archive _build/publish/001-Elsa-medseal-0.2.3.zip --record tmp/platform-snapshot-ci.json
      - name: Source tree remains unchanged after acceptance
        run: git diff --exit-code
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: tmp/*-ci.json
      - name: Upload offline lab and explicit verification limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-lab-${{ matrix.os }}
          path: tmp/community-lab/

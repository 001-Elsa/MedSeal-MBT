name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Build
        run: moon build --target native
      - name: Collection example
        run: moon run --target native examples/collection
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Independent DICOM verification
        run: |
          python -m pip install pydicom==3.0.1 -r requirements-enterprise.txt
          python tools/verify_with_pydicom.py
      - name: Persistent identity regression
        if: runner.os != 'Windows'
        run: |
          python tools/verify_persistent_identity.py
          python tools/verify_recovery.py
          python tools/verify_risk_gate.py
          python tools/verify_attestation.py
      - name: Package
        run: moon package

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Build
        run: moon build --target native
      - name: Package
        run: moon package
